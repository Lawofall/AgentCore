name: Evals (nightly, real model)

# 真模型离线评测：把黄金用例喂真实运行路径，出确定性 Check + 路由混淆矩阵 + 风格违规率
# + 团队/单体对比。与 per-PR 的零 LLM 门禁（pytest 里的 seed_lint 单测 + 下面的 --lint-only）
# 正交——那守「用例结构」，这守「真模型行为」。真跑要钱且非确定（思考模型不吃 temperature），
# 故只夜跑 / 手动触发，且真跑步骤一律**软门禁**（信息性、不弄红夜跑）；硬门禁只留零 LLM 的
# 用例结构校验。命令与退出码见 apps/server/agentcore/evals/__main__.py。
#
# 草案：需在仓库 Secrets 配 EVAL_DEEPSEEK_API_KEY（建议指向一个**低额度** DeepSeek 账号，
# 配合下面的 schedule 限频 + concurrency 去叠加 + timeout 兜底控成本）。未配 key 则自动跳过
# 真跑、仅跑硬门禁，不报红。
#
# 软门禁的代价是「绿灯不含信息」：跳过与全过在作业页上没有区别。故本 workflow 的红绿判定
# 之外还挂两件事——
#   1. **诚实摘要**（scripts/eval_nightly_summary.py，`if: always()`）：无论跳过 / 降级 /
#      全绿都写作业摘要，逐步骤写明「考了没、出数没、过没过」，并排本次 vs 历史峰值。
#      绿灯 ≠ AI 行为面被考过；水位列只展示、不改红绿。
#   2. **相对基线观测 + 裁判校准**：`--baseline` 挂在既有真跑上（同一份结果既出报告
#      又做相对对比，零额外 LLM）；对比结果是观测、**不改红绿**。裁判校准（--calibrate）
#      单列一步，34 条短判，量 L1 裁判与人工标注的一致度——它是夜跑 pass/fail 主轴，
#      不校准就是拿没刻度的尺子量。
# 两者都**不改**红绿判定：真跑仍是软门禁，硬红与否留待后续单独决策。
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "功能套件名（cases/<suite>/，默认 core）"
        default: "core"
  schedule:
    - cron: "0 18 * * *" # 每天 18:00 UTC（避开 smoke-production 的 08:00）

# 同一时刻只允许一个夜跑，叠加只会重复烧额度。
concurrency:
  group: evals-nightly
  cancel-in-progress: true

jobs:
  evals:
    name: Evals (real DeepSeek)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 兜底：真跑失控时硬停，防烧额度
    defaults:
      run:
        working-directory: apps/server

    # 与 ci.yml backend job 同构的 Postgres（保险）。离线 eval 用 FileMemoryStore + 文件工作区、
    # run_chat_pipeline 返回结果由调用方持久化（eval 不走 API 层），实测不碰 DB——若确认全程
    # 无 DB 触达，可删掉这个 service 与下面的 DATABASE_URL 两行。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentcore
          POSTGRES_PASSWORD: agentcore
          POSTGRES_DB: agentcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://agentcore:agentcore@localhost:5432/agentcore
      TEST_DATABASE_URL: postgresql+asyncpg://agentcore:agentcore@localhost:5432/agentcore
      # 真跑凭据（仓库 Secret）。EVAL_DEEPSEEK_BASE_URL 可选（缺省回落 settings.platform_base_url）。
      EVAL_DEEPSEEK_API_KEY: ${{ secrets.EVAL_DEEPSEEK_API_KEY }}
      EVAL_DEEPSEEK_BASE_URL: ${{ secrets.EVAL_DEEPSEEK_BASE_URL }}
      SUITE: ${{ github.event.inputs.suite || 'core' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      # ---- 硬门禁：零 LLM 用例结构校验（写错立刻挂；__main__ 对配置错 exit 2） ----
      - name: Lint eval cases (hard gate, zero LLM)
        run: |
          uv run python -m agentcore.evals --suite "$SUITE" --lint-only
          uv run python -m agentcore.evals --suite mast --lint-only
          uv run python -m agentcore.evals --suite probe --lint-only
          uv run python -m agentcore.evals --suite collab_shapes --lint-only
          uv run python -m agentcore.evals --routing --lint-only
          uv run python -m agentcore.evals --compare --lint-only

      # ---- 真跑前置：没配 key 就跳过后续真跑步骤，不让夜跑变红 ----
      # 跳过 ≠ 没事：下面的诚实摘要会显式写「AI 行为面本次未覆盖」，不许静默报绿。
      - name: Check eval key present
        id: key
        run: |
          if [ -n "$EVAL_DEEPSEEK_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EVAL_DEEPSEEK_API_KEY 未配置，跳过真模型评测（仅跑零 LLM 硬门禁）。"
          fi

      - name: Prepare report dir
        if: steps.key.outputs.present == 'true'
        run: mkdir -p eval-reports eval-out

      # 快照跨夜跑靠 cache 滚动：key 带 run_id 保证每跑都能写新档，restore-keys 前缀
      # 取回最近一份。目录里同时放「最近一次成功快照」（*-latest.json，--baseline 对着它）
      # 和「只升的历史峰值」（*-baseline.json）。只对着峰值比会让缓慢漂移永远看不见。
      - name: Restore eval snapshots
        if: steps.key.outputs.present == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/server/eval-out
          key: evals-baseline-${{ env.SUITE }}-${{ github.run_id }}
          restore-keys: |
            evals-baseline-${{ env.SUITE }}-

      # 旧 cache 只有峰值文件：播种 latest，避免改策略后首夜对比空白。
      - name: Seed latest snapshots from high-water
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: python3 scripts/eval_nightly_snapshots.py --seed --out-dir eval-out --suite "$SUITE"

      # ---- 软门禁：真模型评测（continue-on-error，非确定回归不弄红夜跑；出数留作观测/基线） ----
      #
      # 裁判校准（gold-set 判↔人 Cohen's kappa）：夜跑的 pass/fail 主轴是 L1 LLM 裁判，而未校准
      # 的裁判 = 没刻度的尺子——kappa 不量出来，下面所有 pass_rate（含相对基线观测）都没有可信度。
      # 排在最前的两个理由：34 条短判是全场最便宜的一步（相对整套真跑可忽略），且能对坏凭据 /
      # 额度耗尽快速失败，不必等 45 分钟 timeout 才发现。
      - name: Judge calibration (gold-set kappa, soft)
        id: calibrate
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: uv run python -m agentcore.evals --calibrate --out eval-reports/calibration.json

      # --baseline 挂在**这一次**真跑上（而非另起一跑）：对着最近成功快照做相对观测，
      # 零额外 LLM。判定写进报告的 ratchet 段供摘要读，不在 CI 里拿 jq 重算，也不因观测变红。
      - name: Functional suite (deterministic checks + observe, soft)
        id: functional
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: >
          uv run python -m agentcore.evals --suite "$SUITE"
          --baseline "eval-out/$SUITE-latest.json"
          --out eval-reports/functional.json

      # MAST 失败标签套件（学·度量 §2.5 / §五 ①）：协作形状铺开的**数据闸门**
      # 默认铺开的**数据闸门**——按 MAST 14 类 / 三组聚合通过率（report 的 summary.by_mast），
      # 看「哪一类失败被压下去了」。team 路径 + milestone 裁判（layer 2 默认），故必须真模型。
      - name: MAST failure-label suite (collab rollout + observe, soft)
        id: mast
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: >
          uv run python -m agentcore.evals --suite mast
          --baseline eval-out/mast-latest.json
          --out eval-reports/mast.json

      - name: Routing accuracy (confusion matrix + observe, soft)
        id: routing
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: >
          uv run python -m agentcore.evals --routing
          --baseline eval-out/routing-latest.json
          --out eval-reports/routing.json

      - name: Output-style anti-slop (violation rates + observe, soft)
        id: style
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: >
          uv run python -m agentcore.evals --style --suite "$SUITE"
          --baseline eval-out/style-latest.json
          --out eval-reports/style.json

      - name: Team-vs-single comparison (pairwise judge + observe, soft)
        id: compare
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: >
          uv run python -m agentcore.evals --compare
          --baseline eval-out/comparison-latest.json
          --out eval-reports/comparison.json

      # ---- 软门禁·挖坑探针（交付前核验「重层」立项的证据绊线，见 docs/02-架构/后端架构.md §五）：
      # 跑「便宜层 finish_guard 够不着」的两类——①算术/单一答案（确定性地面真值 ContentMatches）、
      # ②代码必须真跑（生成→沙箱跑隐藏边界用例）。开发期实测两类均近满分（缺口不在此），故为观测性
      # 软门禁；哪天通过率抬头，即「机械轻层不够、该上重层」的触发信号。
      - name: Probe · arithmetic ground-truth (observe, soft)
        id: probe
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: >
          uv run python -m agentcore.evals --suite probe --layer 1
          --baseline eval-out/probe-latest.json
          --out eval-reports/probe.json

      - name: Probe · code-must-run (soft)
        id: probe_code
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: uv run python scripts/archive/probe_code_execution.py --out eval-reports/probe_code.json

      # 双快照：每次出数都覆盖 *-latest.json（下一夜的 --baseline）；峰值 *-baseline.json
      # 仍只升不降。脚本恒 0 退出——对比结果不得弄红作业。
      - name: Snapshot eval baselines (latest + high-water)
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        run: python3 scripts/eval_nightly_snapshots.py --reports-dir eval-reports --out-dir eval-out --suite "$SUITE"

      - name: Save eval snapshots
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: apps/server/eval-out
          key: evals-baseline-${{ env.SUITE }}-${{ github.run_id }}

      # 诚实摘要（无论跳过 / 降级 / 全绿都写）：逐步骤写明「考了没、出数没、过没过」，
      # 并排给出本次 vs 历史峰值（只升 `*-baseline.json`，不是昨夜快照），头部给覆盖结论。
      # 脚本恒 0 退出——红绿判定不在这里，真跑仍是软门禁；水位列不算退化、不改红绿。
      # 用 python3（非 uv run）：装依赖那步若挂了，摘要仍要能写出来。
      - name: Write job summary (coverage honesty)
        if: always()
        continue-on-error: true
        env:
          EVAL_KEY_PRESENT: ${{ steps.key.outputs.present }}
          EVAL_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 scripts/eval_nightly_summary.py --out "$GITHUB_STEP_SUMMARY" --out-dir eval-out --suite "$SUITE"

      - name: Upload eval reports
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: apps/server/eval-reports/
          if-no-files-found: warn

      - name: Upload eval snapshots
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-snapshots
          path: apps/server/eval-out/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # R4 真仓回归 · 可选挂载点（默认不启用；不进 PR 硬门禁；默认不烧 LLM）
  #
  # 本地权威命令（仓库根）：
  #   python evals/code-capability/r4_regress.py --lint-only
  #   python evals/code-capability/r4_regress.py --compare-latest
  #   python evals/code-capability/r4_regress.py --run --phases r0,r3   # 可选全矩阵，可慢
  #
  # 若要挂本 workflow：新增 workflow_dispatch input `run_r4_regress`（boolean, default false），
  # 并加 job（示例，勿默认 schedule 强制跑）：
  #
  #   r4-regress:
  #     name: R4 real-vendor regress (optional, no LLM)
  #     if: github.event_name == 'workflow_dispatch' && inputs.run_r4_regress == true
  #     runs-on: ubuntu-latest
  #     timeout-minutes: 30
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: actions/setup-python@v5
  #         with: { python-version: '3.12' }
  #       - name: R4 lint + compare-latest
  #         run: |
  #           python evals/code-capability/r4_regress.py --lint-only --phases r0,r3
  #           python evals/code-capability/r4_regress.py --compare-latest
  #
  # 无 EVAL key 时只跑上列无 LLM 路径；全量 --run 矩阵留给维护者手工，防 CI 过久。
  # 文档：evals/code-capability/README.md「R4」· reports/baselines/README.md
  # ---------------------------------------------------------------------------
