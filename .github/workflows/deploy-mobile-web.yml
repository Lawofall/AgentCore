name: Deploy Mobile Web

# 已退役：独立 m.example.com 站已下线（Pages 项目已删）。
# 禁止再部署手机 SPA / stub。
# 仅保留 workflow_dispatch，误触即失败退出。

on:
  workflow_dispatch:

concurrency:
  group: deploy-mobile-web
  cancel-in-progress: true

jobs:
  retired:
    name: Retired (m. host removed)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse deploy
        run: |
          echo "手机 Web SPA 已退役：独立 m.example.com 站已下线。"
          echo "禁止再部署 stub / SPA。本 workflow 不再构建或上传。"
          exit 1
