# 云端代码执行沙箱叠加（gVisor，默认开）— 与 server + app compose 三文件合并使用。
#
# 作用：给 api 容器补齐「容器内跑 runsc」+「云端 browser_*/package_install 的
# ip netns + veth」所需的运行时权限与资源余量。
# 护栏 GVISOR_* 与紧急关闭 GVISOR_ENABLED=false 放 deploy/config/production.env
# （见 production.env.example「云端代码执行」段）。
# deploy-server.sh / finish-server.sh **默认叠加**本文件；仅显式 GVISOR_ENABLED=false 跳过。
# 不叠本文件时沙箱起不来，启动期健康探测失败**不拒启**（fail-safe）：打
# sandbox.cloud_health_failed / browser.netns_health_failed warning、执行类与
# browser_* 整类不装配、能力行如实显示未装配，不悄悄回落 subprocess / Bridge。
#
# 手动用法（服务器）：
#   docker compose \
#     -f deploy/docker-compose.server.yml \
#     -f deploy/docker-compose.app.yml \
#     -f deploy/docker-compose.sandbox.yml \
#     --env-file deploy/config/production.env \
#     up -d
#
# 部署后人工验证清单见 部署拓扑与环境.md §云端执行（gVisor）。
# 发布前自检：python apps/server/scripts/verify_gvisor_sandbox.py [--live]
services:
  api:
    # rootless runsc 在容器内需要创建 user/mount namespace 等被 Docker 默认
    # seccomp/AppArmor profile 拦截的系统调用。宿主侧前置：内核开启非特权用户
    # 命名空间（sysctl kernel.unprivileged_userns_clone=1，多数现代发行版默认开）。
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    # Root 只给入口脚本：准备容器私有 /run/netns（保持 root 所有，不 chown 给
    # app），以 uid 0 起 sandboxd，再 setpriv 降为 app 且不保留 ambient cap。
    # API 进程无 NET_ADMIN/SYS_ADMIN。禁止 privileged:true；不要挂宿主
    # /run/netns。cap_add 留给同容器 sandboxd（唯一 exec runsc/ip 的进程）。
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./api-sandbox-entrypoint.sh:/usr/local/bin/api-sandbox-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/api-sandbox-entrypoint.sh"]
    # Compose 覆盖 entrypoint 时会丢掉镜像 CMD；不写 command 则容器空跑、秒退、重启循环。
    command: ["python", "-m", "agentcore"]
    # 沙箱内存记在 api 容器 cgroup 名下：基线 ~1G + 1×浏览器 + 并发 2 ×
    # 单次 512MB 执行 + 余量。覆盖 app compose 的 mem_limit=1024m。
    mem_limit: 4g
