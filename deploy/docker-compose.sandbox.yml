# 云端执行面（gVisor）— 与 server + app compose 三文件合并使用。
#
# 独立 sandboxd 服务持有 runsc / netns / 装包代理 / 云端 Chromium。
# API 只经 Unix socket RPC；不叠本文件时沙箱起不来，启动期健康探测失败
# 不拒启（fail-safe）：打 sandbox.cloud_health_failed、执行类不装配。
# 紧急关闭：GVISOR_ENABLED=false 后 finish（见 production.env.example）。
# deploy-server.sh / finish-server.sh 默认叠加本文件。
#
# 切流替换：不把 sandboxd 叠进 api，不留 in-API guest 回落。
# 预览 HTTP：本文件发 127.0.0.1:8787（勿 0.0.0.0）；宿主 nginx 独立 origin 反代。
# API 不提供预览字节。
#
# 手动用法（服务器）：
#   docker compose \
#     -f deploy/docker-compose.server.yml \
#     -f deploy/docker-compose.app.yml \
#     -f deploy/docker-compose.sandbox.yml \
#     --env-file deploy/config/production.env \
#     up -d
#
# 部署后人工验证清单见 部署拓扑与环境.md §云端执行（gVisor）。
# 发布前自检：python apps/server/scripts/verify_gvisor_sandbox.py [--live]

x-logging: &sandbox-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  sandboxd:
    image: ${IMAGE_REGISTRY:-agentcore}/api:${IMAGE_TAG:-latest}
    container_name: agentcore-sandboxd
    restart: unless-stopped
    stop_grace_period: 40s
    logging: *sandbox-logging
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    env_file:
      - ./config/production.env
    environment:
      DATA_DIR: /data
      GVISOR_RUNTIME_ROOT: /data/sandbox
      SANDBOXD_SOCKET: /run/agentcore/sandboxd.sock
      # Container must bind 0.0.0.0 to receive the published port. Host publish
      # stays 127.0.0.1:8787 (not 0.0.0.0). Code default 127.0.0.1 is for non-container.
      PREVIEW_BIND_HOST: "0.0.0.0"
      PREVIEW_BIND_PORT: "8787"
    volumes:
      - appdata:/data
      - sandbox-run:/run/agentcore
      - ./sandboxd-entrypoint.sh:/usr/local/bin/sandboxd-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/sandboxd-entrypoint.sh"]
    command: ["python", "-m", "agentcore.tools.sandbox.sandboxd"]
    mem_limit: 4g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/agentcore/sandboxd.sock"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # Preview HTTP: host nginx (separate preview origin) → this bind. Not 0.0.0.0.
    # API does not serve preview bytes; RPC stays on the Unix socket.
    ports:
      - "127.0.0.1:8787:8787"

  api:
    environment:
      SANDBOXD_SOCKET: /run/agentcore/sandboxd.sock
    volumes:
      - sandbox-run:/run/agentcore
    depends_on:
      sandboxd:
        condition: service_started

volumes:
  sandbox-run:
