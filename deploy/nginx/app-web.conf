# app.example.com — WEB CLIENT（apps/desktop → dist-web）同源挂在 "/" 的参考 snippet。
# 页面 app.example.com/ 与 API app.example.com/api/ 同一 server 块 → 第一方 cookie、零 CORS。
#
# 用法：把下方 `root` + `location /` + `location /assets/` 合入你的 app. TLS server 块；
# 保留既有 `/api/`、`/api/ws/`、`/storage/`、`/internal/`、`/_market/` 等反代原样不动。
# 文末 preview.example.com 是**独立 origin**（反代 127.0.0.1:8787），不要合进 app. SPA。
# 实际域名用 env / GitHub vars 覆盖（默认占位 app.example.com / preview.example.com）。
#
# 说明：用静态 `location /` 替换原先把非 API 路径全部 proxy_pass 到后端的 catch-all 后，
# `/docs` 与 `/openapi.json` 不再对外（落到 SPA shell）——公网通常不暴露 FastAPI 文档。
#
# nginx 最长前缀优先，故 /api/、/storage/ 仍赢；`location /` 只接其余（SPA + assets）。
# 路由为 hash（createHashRouter），try_files 只需根路径回 index.html。
#
# 部署刷新静态：`pnpm -C apps/desktop deploy:web` → /opt/agentcore/web/dist。

# --- add inside `server { server_name app.example.com; ... }` ---

    root /opt/agentcore/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the content-hashed build assets; never cache the HTML shell so a new
    # deploy is picked up immediately.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- keep AS-IS (already present in the app. block; shown for placement only) ---
    # location /api/     { proxy_pass http://127.0.0.1:8000/; proxy_buffering off; ... }  # SSE
    # location /storage/ { proxy_pass http://minio:9000/;     proxy_set_header Host minio:9000; ... }

# --- separate preview origin (NOT the app SPA). Own server_name / TLS / Tunnel. ---
# Host nginx terminates the public preview origin and proxies to sandboxd.
# Compose publishes sandboxd as 127.0.0.1:8787 only (not 0.0.0.0).
# API does not serve preview bytes; ticket mint stays on the app API origin.
# PREVIEW_PUBLIC_BASE_URL must match this origin (empty = mint 503).
# Tunnel: preview.<brand> → this listen. WebSocket Upgrade is required (vite HMR).
# 实际域名用 env / GitHub vars 覆盖（默认占位 preview.example.com）。
#
# map 放在 http {}（与 server 同级）。无 Upgrade 时 Connection 不能写死 upgrade。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8093;
    server_name preview.example.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
