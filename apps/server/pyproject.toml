[project]
name = "agentcore"
version = "0.7.10"
description = "AgentCore - Multi-Agent AI Workspace Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # >=0.50: `--ws auto` defaults to websockets-sansio, dropping the deprecated
    # websockets.legacy import path (warning-free with websockets>=14).
    "uvicorn[standard]>=0.50",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "sse-starlette>=2.2",
    "pwdlib[argon2]>=0.3.0",
    "boto3>=1.43.29",
    "cryptography>=50.0.0",
    "pyotp>=2.9",
    "pillow>=12.3.0",
    "markdown-it-py>=3.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "markitdown[docx,pdf,pptx]>=0.1.6",
    "python-docx>=1.2.0",
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
# 内置 Python 打包（方案 B）sidecar 运行时子集。来源 = ``agentcore.sidecar.server`` 静态
# import 闭包 + **与云对齐的 Office 文档能力**（附件 markitdown 预解析 + 确定性 md→docx/pdf）。
# 仍剔除：FastAPI/uvicorn、迁移、Redis、S3、JWT/密码学（jose/cryptography/pwdlib/passlib）
# 等不在 sidecar 回合路径上的栈。``scripts/bundle-sidecar.mjs`` 以 ``--no-deps`` 装
# agentcore 包本体 + 本组依赖。**改闭包时需同步本组并跑 bundle:sidecar 冒烟（含 docx/pdf）。**
# 否决：为瘦身砍掉 Office 却仍跑同一 ``run_chat_pipeline``（缺 ``docx``/``fpdf2`` → PIPELINE_ERROR）。
sidecar = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # Office literacy（与主 dependencies 同版本约束；云 API 镜像走主依赖，本地引擎走本组）
    "markdown-it-py>=3.0",
    "markitdown[docx,pdf,pptx]>=0.1.6",
    "python-docx>=1.2.0",
    "fpdf2>=2.8.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "httpx>=0.28",
    # starlette>=1.3 TestClient prefers httpx2 (plain httpx emits
    # StarletteDeprecationWarning). Test-only: production outbound stays on httpx.
    "httpx2>=2.7",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "mypy>=2.3",
]

[project.scripts]
agentcore = "agentcore.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Wheel otherwise drops non-.py package data; the sandbox list must ship so
# ``code_execute`` descriptions can read it from a non-editable install.
[tool.hatch.build.targets.wheel.force-include]
"agentcore/tools/sandbox/cloud_python.txt" = "agentcore/tools/sandbox/cloud_python.txt"

[tool.ruff]
target-version = "py312"
line-length = 100
# Autogenerated Alembic migration scripts: don't lint generated boilerplate.
# scripts/_*.py: ad-hoc underscore-prefixed one-off probe/analysis scripts dropped by
# parallel sessions — scratch, not release code; excluded so release:gate ruff stays green.
# evals/fixtures: synthetic workspaces for playbook-routing (intentionally messy).
extend-exclude = [
    "agentcore/db/migrations/versions",
    "tmp",
    "scripts/_*.py",
    "agentcore/evals/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008", "A002", "E402"]

[tool.ruff.lint.per-file-ignores]
# Prompt-template module: long lines are verbatim LLM instructions, not code;
# reflowing them would change what the planner model receives.
"agentcore/runtime/planner.py" = ["E501"]
"agentcore/runtime/resolve/prompt/*.py" = ["E501"]
# Debate orchestration + tool packages: dense Chinese design commentary (主持人循环 /
# 质询·记分·举证·结辩 各阶段的 why) + verbatim LLM feedback templates. Same reason-to-exempt as
# the vectors glob below — reflowing the CJK prose hurts readability/diff, and E501 counts CJK
# width×2 so ~50-char comment lines trip it. Glob the whole packages (not just prompt.py) so
# sibling modules (moderator/types/rounds/tool/schema) stay consistent as the feature grows.
"agentcore/runtime/debate/*.py" = ["E501"]
"agentcore/tools/builtin/debate/*.py" = ["E501"]
# Legal-vertical Skill bodies are verbatim Chinese LLM guidance (string literals),
# same reason-to-exempt as runtime/skills/**: reflowing changes what the CEO consults.
"agentcore/runtime/legal_skills.py" = ["E501"]
# Conformance vectors embed long Chinese fixture strings; reflowing hurts diff readability.
# (vectors became a package — match every vector module, not just the old single file.)
"agentcore/conformance/vectors/*.py" = ["E501"]
# Protocol exception names are stable public API (workspace/storage error taxonomy).
"agentcore/workspace/protocol.py" = ["N818"]
"agentcore/storage/protocol.py" = ["N818"]
"agentcore/runtime/delegate/ceo_format.py" = ["E501"]
"agentcore/tools/builtin/delegate/schema.py" = ["E501"]
"agentcore/runtime/delegate/drive.py" = ["E501"]
"agentcore/tools/builtin/delegate/tool.py" = ["E501"]
"agentcore/runtime/runs/executor/node.py" = ["E501"]
"agentcore/runtime/runs/executor/setup.py" = ["E501"]
"agentcore/runtime/runs/executor/loop.py" = ["E501"]
"agentcore/runtime/runs/executor/retry.py" = ["E501"]
"agentcore/runtime/runs/executor/hooks.py" = ["E501"]
"agentcore/runtime/runs/executor/terminal.py" = ["E501"]
"agentcore/runtime/runs/executor/escalation.py" = ["E501"]
"agentcore/tools/protocol.py" = ["E501"]
"agentcore/tools/builtin/git_ops/**" = ["E501"]
"agentcore/tools/builtin/revise.py" = ["E501"]
"agentcore/sidecar/server_pkg/handlers.py" = ["E501"]
"tests/**" = ["E501", "B017", "N818", "UP031"]
"scripts/**" = ["E501"]
"agentcore/runtime/skills/**" = ["E501"]
"agentcore/runtime/events/disposition.py" = ["E501"]
"agentcore/runtime/runs/executor/identities.py" = ["E501"]
"agentcore/conformance/vectors/__init__.py" = ["F401"]
"agentcore/api/routes/conversations/crud.py" = ["E501"]
"agentcore/api/routes/inference/proxy.py" = ["E501"]
"agentcore/core/error_codes.py" = ["E501"]
"agentcore/db/repositories/messages.py" = ["E501"]
"agentcore/llm/resolve.py" = ["E501"]
"agentcore/llm/sub2api_probe.py" = ["E501"]
"agentcore/memory/user_memory.py" = ["E501"]
"agentcore/runtime/context/workspace_overview.py" = ["E501"]
"agentcore/runtime/engine/round.py" = ["E501"]
"agentcore/runtime/engine/stream.py" = ["E501"]
"agentcore/runtime/facts.py" = ["E501"]
"agentcore/runtime/pipeline/resume/pipeline.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# tmp dirs: routed to a unique-per-session folder under the OS temp dir by
# tests/conftest.py::pytest_configure (NOT pinned here). Both the default base (a
# `pytest-current` symlink whose cleanup throws WinError 5 on Windows) and a fixed
# shared --basetemp (unsuppressed rm_rf-reset at session start → WinError 5 the moment
# a prior run leaked a file handle) make a fully-passing run exit non-zero on Windows;
# a fresh per-session basetemp needs no reset and is never auto-cleaned. See conftest.
# Per-test wall-clock guard (pytest-timeout): a hung test — e.g. an asyncio await on
# an event that never fires — would otherwise stall the whole suite for minutes (CI /
# parallel agents just see a silent hang). This converts that into a fast, faulthandler-
# dumped failure instead. ``thread`` method is mandatory on Windows (the default
# ``signal``/SIGALRM is POSIX-only). 60s sits far above any real test's runtime yet
# still trips a true (unbounded) hang quickly; individual slow tests can override with
# ``@pytest.mark.timeout(N)``.
timeout = 60
timeout_method = "thread"
markers = [
    # Opt-out: tests/conftest.py patches fulfill delivery to always succeed (channel round
    # trips need it); a test asserting the unpatched outcome would otherwise wait out the
    # channel timeout instead of getting NO_FULFILLER.
    "real_fulfill_dispatch: run against the unpatched agentcore.fulfill.dispatch",
]

# Coverage baseline (P4-3): report-only — no fail-under ratchet yet.
# Full: uv run pytest --cov=agentcore --cov-report=term-missing --ignore=tests/integration
# Quick smoke: uv run pytest tests/test_mfa_rate_limit.py --cov=agentcore --cov-report=term-missing
# Root shortcut: pnpm test:server:cov
[tool.coverage.run]
source = ["agentcore"]
branch = false
omit = [
    "agentcore/db/migrations/*",
    "agentcore/db/migrations/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Intentionally unset: establish a baseline first; ratchet fail_under in a later pass.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
# Static type gate — introduced 2026-07 as a LOOSE first-pass baseline on a backend that
# predates type-checking. The global posture stays permissive so adoption is non-disruptive:
#   * files scoped to the product package (tests/ and scripts/ are out of this baseline);
#   * ignore_missing_imports — third-party libs without stubs never fail the gate;
#   * follow_imports = silent — modules pulled in transitively are analyzed, not reported;
#   * generated Alembic migrations are excluded (same stance as ruff's extend-exclude).
# The ~130 modules that already trip mypy are quarantined in the override block below with
# ignore_errors, so today's tree reports 0 errors. Everything NOT quarantined is fully
# checked (attr-defined / arg-type / … stay active) → new & clean code gets real coverage.
# Ratchet: shrink the quarantine list by fixing a module's types deliberately. Do NOT edit
# product code just to satisfy mypy, and do NOT add new modules to the list.
python_version = "3.12"
files = ["agentcore"]
exclude = ['migrations[\\/]versions']
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true

[[tool.mypy.overrides]]
# Pre-existing errors quarantined at mypy adoption (see [tool.mypy] header). Root causes are
# mypy-vs-dynamic-code friction — SQLAlchemy Result/InstrumentedAttribute typing gaps, mixin
